<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Flipnote｜単語帳</title><style>
*{box-sizing:border-box}body{margin:0;color:#263146;background:#f7f7f2;font:15px "Yu Gothic",Meiryo,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}header{height:68px;background:#fffef9;border-bottom:1px solid #d6d8d2;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font:bold 28px Georgia;display:flex;gap:13px;align-items:center}.logo{width:30px;height:24px;border:2px solid #fff;background:#365ace;border-radius:3px;box-shadow:-4px 3px #8faae6;transform:rotate(-10deg)}.brand small{font:12px sans-serif;color:#777e85;border-left:1px solid #c7c9ca;padding-left:15px}.btn,header button{border:1px solid #cbd0cb;background:#fffef9;border-radius:7px;padding:9px 16px;font-weight:600}.canvas{min-height:calc(100vh - 68px);background-image:radial-gradient(#c9ccc3 .8px,transparent 1px);background-size:16px 16px;padding:36px 20px}.wrap{max-width:840px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:29px;letter-spacing:.04em;margin:0}.eyebrow,.mono{font:11px monospace;letter-spacing:.14em;color:#53699a}.eyebrow{margin:0 0 8px}.stats{display:flex;align-items:center;gap:16px;margin:16px 0 0;color:#5e6570;font-size:13px}.track{height:5px;background:#dcded8;border-radius:4px;flex:1;overflow:hidden}.track i{display:block;background:#4160c5;height:100%}.stage{position:relative;width:min(100%,640px);height:clamp(238px,34vh,310px);margin:46px auto 28px;perspective:1100px}.sheet,.face{position:absolute;inset:0;border:1px solid #c4c4b8;border-radius:12px;background:#fffdf0}.s1{transform:rotate(2deg) translate(3px,8px);background:#e5e6dc;box-shadow:0 8px 15px #43463821}.s2{transform:rotate(-1.8deg) translate(-2px,5px);background:repeating-linear-gradient(#f2f0e6 0 25px,#dcdfd6 26px)}.tab{position:absolute;right:30px;top:-19px;background:#4869bf;color:white;font:bold 10px monospace;letter-spacing:.14em;padding:6px 18px 10px;border-radius:5px 5px 0 0}.move,.card{height:100%;position:relative}.move{touch-action:pan-y}.card{width:100%;border:0;padding:0;background:transparent;transform-style:preserve-3d;transition:transform .52s}.flip{transform:rotateY(180deg)}.face{backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(90deg,transparent 44px,#dc9b9780 45px,transparent 46px),repeating-linear-gradient(0deg,#fffdf1 0 27px,#dce2dd 28px);box-shadow:0 2px 4px #3f443622}.back{transform:rotateY(180deg)}.hole{position:absolute;top:17px;left:19px;width:12px;height:12px;border-radius:50%;background:#c7c8bb;box-shadow:inset 1px 2px 3px #77796b}.num{position:absolute;top:17px;right:22px;font:11px monospace;color:#858982}.word{font:clamp(32px,7vw,66px) Georgia,serif;color:#203253;max-width:84%;overflow-wrap:anywhere;line-height:1.14}.back .word{font:600 clamp(24px,4vw,38px) serif}.face small{color:#76808b;margin-bottom:12px;font:11px monospace;letter-spacing:.18em}.hint{position:absolute;bottom:17px;color:#6d7580;font-size:12px}.actions{display:flex;justify-content:center;gap:12px}.actions button{padding:13px 22px;border:1px solid #bfc7c4;border-radius:8px;background:#fffef9;font-weight:600}.actions .primary,dialog .primary{background:#365dc2;color:white;border-color:#365dc2}.summary{display:flex;justify-content:center;gap:27px;margin:27px auto;color:#646c73;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.keyhelp{text-align:center;color:#737b80;font-size:12px;margin:25px 0}kbd{padding:2px 5px;border:1px solid #cdd1c8;border-radius:4px;background:#fffef9}.end{text-align:center;position:absolute;inset:0;background:#fffdf0;border:1px solid #c4c4b8;border-radius:12px;align-content:center}.end[hidden]{display:none}dialog{width:min(500px,93vw);max-height:80vh;border:1px solid #cdcfc5;border-radius:12px;background:#fffdf6;color:#263146;padding:24px}dialog::backdrop{background:#16223655}dialog h2{margin:0;font-size:20px}dialog label{display:block;margin:15px 0}dialog input{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #bec5bc;border-radius:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.item{padding:10px 0;border-bottom:1px solid #ddd}.item strong{font:20px Georgia}.item span{font-size:13px}.close{border:0;background:none;font-size:23px}.err{color:#963c33;text-align:center}@media(max-width:550px){.canvas{padding:28px 17px}.brand small{display:none}h1{font-size:23px}.actions{gap:6px}.actions button{padding:12px 9px;font-size:13px}.keyhelp{display:none}.stage{width:95%}.summary{gap:15px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}header{padding-top:env(safe-area-inset-top);height:calc(68px + env(safe-area-inset-top))}.canvas{padding-bottom:calc(30px + env(safe-area-inset-bottom));min-height:calc(100svh - 68px - env(safe-area-inset-top))}.move{perspective:1100px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.card{display:block;-webkit-appearance:none;-webkit-transform-style:preserve-3d}.face{-webkit-backface-visibility:hidden;pointer-events:none}.front{transform:translateZ(1px)}.back{transform:rotateY(180deg) translateZ(1px)}button{min-height:44px;touch-action:manipulation}.card{touch-action:pan-y}.close{min-width:44px}dialog{overflow-y:auto}dialog input{font-size:16px}.end{display:flex;flex-direction:column;align-items:center;justify-content:center}.item{overflow-wrap:anywhere}.long .word{font-size:clamp(16px,4vw,24px);max-height:56%;overflow:auto}.long small{margin-bottom:4px}
@media(max-width:550px){header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}.canvas{padding-top:23px}.heading{gap:6px}.heading .btn{padding:8px;white-space:nowrap}.heading h1{font-size:clamp(18px,5vw,24px)}.stage{height:clamp(212px,34svh,320px);margin:37px auto 25px}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.actions button{padding:8px 2px;min-height:48px}.summary{gap:12px;flex-wrap:wrap}.stats{gap:9px}.word{max-width:83%}}
dialog:not([open]){display:none}dialog.fallback[open]{position:fixed;inset:0;z-index:10;margin:auto;height:fit-content;box-shadow:0 0 0 100vmax #16223666}</style><noscript><p>このプレビューではカードを操作できません。iPhoneではFlipnoteのダウンロード案内にある起動手順に従って開いてください。</p></noscript><header><div class="brand"><i class="logo"></i>Flipnote <small>わたしの単語帳</small></div><button id="add">＋ カードを追加</button></header><main class="canvas"><div class="wrap"><p class="eyebrow">MY FLASHCARDS</p><div class="heading"><h1>英検準1級の英単語</h1><button class="btn" id="list">▤ カード一覧</button></div><div class="stats"><span>学習の進み具合</span><div class="track"><i id="bar"></i></div><b id="count"></b></div><div class="stage"><div class="sheet s1"></div><div class="sheet s2"></div><div class="tab">VOCABULARY</div><div class="move" id="move"><button class="card" id="card" aria-label="カードを裏返す"></button></div><section class="end" id="end" hidden><p class="mono">SESSION COMPLETE</p><h2>ひと通り学習しました</h2><button class="btn" id="restart"></button></section></div><div class="actions"><button id="again">← もう一度</button><button class="primary" id="turn">⟳ 裏返す</button><button id="good">覚えた →</button></div><div class="summary" aria-live="polite" id="summary"></div><div class="keyhelp"><kbd>Space</kbd> 裏返す　 <kbd>←</kbd> もう一度　 <kbd>→</kbd> 覚えた</div><p class="err" id="err"></p></div></main><dialog id="dlg"><div class="row"><h2 id="title"></h2><button class="close" id="closeDlg" aria-label="閉じる">×</button></div><div id="bodyDlg"></div></dialog><script>
const $=id=>document.getElementById(id),key='flipnote-study-v1';
const initial=[['resilient','回復力のある'],['allocate','割り当てる'],['plausible','もっともらしい'],['prosper','繁栄する'],['substantial','かなりの、相当な'],['anticipate','予期する'],['versatile','多才な、用途の広い'],['compensate','埋め合わせる'],['inevitable','避けられない'],['preserve','保存する、守る'],['reluctant','気が進まない'],['enhance','高める']];
let state={cards:initial,queue:initial.map((_,i)=>i),again:[],good:[]},back=false,busy=false,drag=null,suppress=false;
try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&['cards','queue','again','good'].every(k=>Array.isArray(saved[k])))state=saved}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('err').textContent='このブラウザでは学習記録を保存できません。'}}
function esc(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){let {cards,queue,again,good}=state,n=cards.length,id=queue[0],done=n-queue.length;$('count').textContent=done+' / '+n+' 枚';$('bar').style.width=done/n*100+'%';$('summary').innerHTML=[['#b5bbbd','未学習',queue.length],['#d1a35d','もう一度',again.length],['#659c83','覚えた',good.length]].map(([color,name,v])=>'<span><i class="dot" style="background:'+color+'"></i>'+name+' <b>'+v+'</b></span>').join('');$('end').hidden=queue.length>0;$('move').hidden=!queue.length;document.querySelector('.actions').style.visibility=queue.length?'visible':'hidden';$('restart').textContent=again.length?'もう一度の '+again.length+' 枚を復習':'最初から学習する';if(!queue.length)return;
$('card').classList.remove('flip');back=false;$('card').innerHTML=cards[id].map((v,i)=>'<span class="face '+(i?'back':'front')+(v.length>22?' long':'')+'"><i class="hole"></i><span class="num">No. '+String(id+1).padStart(3,'0')+'</span><small>'+(i?'MEANING':'ENGLISH')+'</small><strong class="word">'+esc(v)+'</strong><span class="hint">'+(i?'左右に払って仕分ける':'⟳　タップして裏返す')+'</span></span>').join('')}
function flip(){if(busy||!state.queue.length)return;back=!back;$('card').classList.toggle('flip',back)}
function rate(known){if(busy||!state.queue.length)return;busy=true;let m=$('move'),d=known?1:-1;m.style.transition='transform .2s,opacity .2s';m.style.transform='translateX('+d*110+'px) rotate('+d*9+'deg)';m.style.opacity=0;setTimeout(()=>{state[known?'good':'again'].push(state.queue.shift());save();$('card').style.transition='none';draw();m.style.cssText='';void m.offsetWidth;$('card').style.transition='';busy=false},205)}
$('card').onclick=e=>{if(e.detail===0||!suppress)flip();suppress=false};$('turn').onclick=flip;$('again').onclick=()=>rate(false);$('good').onclick=()=>rate(true);
$('move').onpointerdown=e=>{
  if(busy || !e.isPrimary || e.button!==0)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,axis:null};
  suppress=false;
  if(e.currentTarget.setPointerCapture) {
    try { $('card').setPointerCapture(e.pointerId) } catch {}
  }
};
function trackGesture(e){
  if(!drag || drag.id!==e.pointerId)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.axis && Math.max(Math.abs(dx),Math.abs(dy))>8){
    drag.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';
    suppress=true;
  }
  if(drag.axis==='x')$('move').style.transform='translateX('+dx*.65+'px) rotate('+dx*.045+'deg)';
}
$('move').onpointermove=trackGesture;
$('move').onpointerup=e=>{
  if(!drag || drag.id!==e.pointerId)return;
  trackGesture(e);
  const dx=e.clientX-drag.x, horizontal=drag.axis==='x';
  drag=null;
  if(horizontal && Math.abs(dx)>Math.min(60,$('move').clientWidth*.17))rate(dx>0);
  else $('move').style.transform='';
};
$('move').onpointercancel=()=>{drag=null;suppress=true;$('move').style.transform=''};
$('restart').onclick=()=>{if(state.again.length){state.queue=state.again;state.again=[]}else{state.queue=state.cards.map((_,i)=>i);state.good=[]}save();draw()};
function closeDialog(){const d=$('dlg');if(typeof d.close==='function')d.close();else d.removeAttribute('open')}
function modal(t,html){const d=$('dlg');$('title').textContent=t;$('bodyDlg').innerHTML=html;if(typeof d.showModal==='function')d.showModal();else{d.classList.add('fallback');d.setAttribute('open','')}}
$('list').onclick=()=>modal('カード一覧（'+state.cards.length+'枚）',state.cards.map(([a,b])=>'<div class="item row"><strong>'+esc(a)+'</strong><span>'+esc(b)+'</span></div>').join(''));
$('add').onclick=()=>{modal('カードを追加','<form id="form"><label>表面（英単語）<input id="front" required maxlength="80"></label><label>裏面（意味）<input id="meaning" required maxlength="100"></label><button class="btn primary">カードを追加</button></form>');$('front').focus();$('form').onsubmit=e=>{e.preventDefault();let a=$('front').value.trim(),b=$('meaning').value.trim();if(!a||!b)return;state.queue.push(state.cards.length);state.cards.push([a,b]);save();draw();closeDialog()}};
$('closeDlg').onclick=()=>closeDialog();document.onkeydown=e=>{if($('dlg').open||e.repeat)return;if(e.code==='Space'&&(document.activeElement.tagName!=='BUTTON'||document.activeElement===$('card'))){e.preventDefault();flip()}if(e.key==='ArrowLeft')rate(false);if(e.key==='ArrowRight')rate(true)};draw()
</script></html>
