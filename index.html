<body>
<svg aria-hidden="true" style="display:none"><defs>
<symbol id="i-cards" viewBox="0 0 24 24"><path d="m5 4 14 2-2 16-14-2zM8 2l13 2-1 15M7 9l7 1M6 13l7 1"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M3 4h6l3 2 3-2h6v15h-6l-3 2-3-2H3zM12 6v15"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 9M20 3v6h-6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
</defs></svg>
<header><div class="brand"><span class="brandmark"><svg class="icon"><use href="#i-cards"/></svg></span>Flipnote</div><button class="headerlink" data-page="library"><svg class="icon"><use href="#i-book"/></svg>マイライブラリ</button></header>
<main>
<section id="studyPage" aria-labelledby="studyHeading">
<div class="studybody"><div class="studytitle"><div><span class="subjectline" id="subjectLine"></span><h1 id="studyHeading"></h1></div><button class="headerlink" id="switchSet">セットを変更 <span aria-hidden="true">↗</span></button></div><div class="studylayout"><div class="practice">
<div class="panel deckselect" id="selector" hidden><span class="deckicon"><svg class="icon"><use href="#i-book"/></svg></span><label for="deckSelect"><span>学習中のセット</span><select id="deckSelect"></select></label></div>
<div class="progresshead row"><span>仕分け済み</span><b id="progressText"></b></div><div class="track" role="progressbar" aria-label="学習の進み具合" aria-valuemin="0" aria-valuemax="100" id="progress"><i id="progressBar"></i></div>
<div class="stage"><div class="sheet"></div><div class="sheet second"></div><div class="move" id="move"><button class="card" id="card" aria-label="カードを裏返す" aria-pressed="false"></button></div><div id="completion" class="panel completion" hidden><span class="deckicon"><svg class="icon"><use href="#i-check"/></svg></span><h2>おつかれさまでした！</h2><p class="subtitle" id="completeText"></p><button class="button primary" id="restart"></button></div></div>
<div class="actions" id="actions"><button class="button again" id="again"><svg class="icon"><use href="#i-refresh"/></svg>もう一度</button><button class="button primary" id="flip"><svg class="icon"><use href="#i-cards"/></svg>答えを見る</button><button class="button good" id="good"><svg class="icon"><use href="#i-check"/></svg>覚えた</button></div>
<p class="swipehint">タップで裏返す · 左に払うと「もう一度」· 右で「覚えた」</p>
</div><aside class="record"><div class="recordhead"><span class="notebookicon" aria-hidden="true">▤</span><h2>学習記録</h2></div><div class="mastery"><div class="ring" id="ring"><strong id="masteryPct"></strong></div><div><b>習得率</b><small>「覚えた」カードの割合</small></div></div><div class="metrics" id="metrics" aria-live="polite"></div></aside></div>
</div></section>
<section id="libraryPage" aria-labelledby="libraryHeading" hidden>
<div class="row"><h1 id="libraryHeading">ライブラリ</h1><button class="button primary" data-page="create"><svg class="icon"><use href="#i-plus"/></svg>作成</button></div>
<div class="panel librarysummary"><span class="deckicon"><svg class="icon"><use href="#i-book"/></svg></span><div id="libraryStats"></div></div>
<label class="search"><svg class="icon"><use href="#i-search"/></svg><input type="search" id="search" placeholder="セット名・科目で検索" aria-label="学習セットを検索"></label>
<div class="row sectionhead"><h2>学習セット</h2><span class="badge" id="setCount"></span></div><div class="deckgrid" id="deckGrid"></div>
</section>
<section id="createPage" aria-labelledby="createHeading" hidden>
<div class="row"><h1 id="createHeading">学習セットを作成</h1><button class="textbutton" id="cancelAppend" hidden>追加をキャンセル</button></div><p class="subtitle">表に問題、裏に答えを入力しましょう。</p>
<form id="setForm"><div class="panel formpanel"><label class="field">セット名<input id="setName" placeholder="例：英検準1級の英単語" required maxlength="80"></label><label class="field" style="margin-bottom:0">科目<input id="setSubject" placeholder="例：英語、政治・経済" maxlength="40"></label></div>
<div class="row sectionhead"><h2>カード</h2><span id="editorCount" class="badge"></span></div><div id="cardsEditor" class="cardseditor"></div><button class="button addrow" type="button" id="addRow"><svg class="icon"><use href="#i-plus"/></svg>カードを追加</button>
<div class="formactions"><button class="button" type="submit" name="destination" value="library">セットを保存</button><button class="button primary" type="submit" name="destination" value="study">保存して学習</button></div></form>
</section>
<p id="storageError" class="error" role="status" hidden>このブラウザでは保存できません。入力したセットは、この画面を開いている間のみ使用できます。</p>
</main>
<nav class="tabs" aria-label="メインナビゲーション"><button class="tab active" data-page="study" aria-current="page"><svg class="icon"><use href="#i-cards"/></svg>学習</button><button class="tab" data-page="library"><svg class="icon"><use href="#i-book"/></svg>ライブラリ</button><button class="tab" data-page="create"><svg class="icon"><use href="#i-plus"/></svg>セット作成</button></nav>
<div class="notice" id="notice" role="status" hidden></div>
<div class="modal" id="modal" hidden><section role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="modalbox"><div class="row"><h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="閉じる">×</button></div><div id="cardList"></div><button class="button primary" id="appendCards">カードを追加</button></section></div>
<noscript>カードを使うには、ブラウザのJavaScriptを有効にしてください。</noscript>
<script>
'use strict';
const $ = id => document.getElementById(id);
const storageKey = 'flipnote-library-v2';
const initialCards = [['resilient','回復力のある'],['allocate','割り当てる'],['plausible','もっともらしい'],['prosper','繁栄する'],['substantial','かなりの、相当な'],['anticipate','予期する'],['versatile','多才な、用途の広い'],['compensate','埋め合わせる'],['inevitable','避けられない'],['preserve','保存する、守る'],['reluctant','気が進まない'],['enhance','高める']];
function freshSession(cards) { return {queue:cards.map((_, i) => i), again:[], good:[]}; }
function validCards(cards) { return Array.isArray(cards) && cards.length > 0 && cards.every(card => Array.isArray(card) && card.length === 2 && card.every(text => typeof text === 'string' && text.trim())); }
function normalizeSession(cards, session) {
  if (!session || !['queue','again','good'].every(key => Array.isArray(session[key]))) return freshSession(cards);
  const indices = [...session.queue, ...session.again, ...session.good];
  if (indices.length !== cards.length || new Set(indices).size !== cards.length || indices.some(i => !Number.isInteger(i) || i < 0 || i >= cards.length)) return freshSession(cards);
  return session;
}
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved && Array.isArray(saved.sets) && saved.sets.length && saved.sets.every(set => typeof set.id === 'string' && typeof set.title === 'string' && validCards(set.cards))) {
      saved.sets.forEach(set => { set.session = normalizeSession(set.cards, set.session); set.subject = typeof set.subject === 'string' ? set.subject : ''; });
      return saved;
    }
    const legacy = JSON.parse(localStorage.getItem('flipnote-study-v1'));
    const cards = legacy && validCards(legacy.cards) ? legacy.cards : initialCards;
    return {activeId:'english', sets:[{id:'english',title:'英検準1級の英単語',subject:'英語',cards,session:normalizeSession(cards, legacy)}]};
  } catch { return {activeId:'english',sets:[{id:'english',title:'英検準1級の英単語',subject:'英語',cards:initialCards,session:freshSession(initialCards)}]}; }
}
let state = loadState();
if (!state.sets.some(set => set.id === state.activeId)) state.activeId = state.sets[0].id;
let page = 'study', back = false, busy = false, drag = null, suppressClick = false, toastTimer, appendId = null, modalSetId = null, modalTrigger = null;
const currentSet = () => state.sets.find(set => set.id === state.activeId);
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(state)); $('storageError').hidden = true; return true; }
  catch { $('storageError').hidden = false; return false; }
}
function escapeHtml(text) { return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(name) { return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function toast(message) { clearTimeout(toastTimer); $('notice').textContent = message; $('notice').hidden = false; toastTimer = setTimeout(() => $('notice').hidden = true, 3000); }
function showPage(next) {
  page = next;
  ['study','library','create'].forEach(name => $(name + 'Page').hidden = name !== page);
  document.querySelectorAll('.tab').forEach(tab => {
    const active = tab.dataset.page === page;
    tab.classList.toggle('active', active);
    if (active) tab.setAttribute('aria-current','page'); else tab.removeAttribute('aria-current');
  });

  if (page === 'library') renderLibrary();

}
function renderStudy() {
  const set = currentSet(), session = set.session, count = set.cards.length;
  $('subjectLine').textContent = set.subject || '学習セット';
  $('studyHeading').textContent = set.title;
  const mastery = Math.round(session.good.length / count * 100);
  $('ring').style.setProperty('--mastery', mastery + '%');
  $('masteryPct').textContent = mastery + '%';
  $('flip').innerHTML = icon('cards') + '答えを見る';
  $('deckSelect').innerHTML = state.sets.map(deck => '<option value="' + escapeHtml(deck.id) + '">' + escapeHtml(deck.title) + '</option>').join('');
  $('deckSelect').value = set.id;
  const done = session.again.length + session.good.length, percent = Math.round(done / count * 100);
  $('progressText').textContent = done + ' / ' + count + ' 枚';
  $('progressBar').style.width = percent + '%';
  $('progress').setAttribute('aria-valuenow', percent);
  $('metrics').innerHTML = [[session.queue.length,'未学習'],[session.again.length,'もう一度'],[session.good.length,'覚えた']].map(([n,label]) => '<div class="metric"><strong>' + n + '</strong><span>' + label + '</span></div>').join('');
  const complete = !session.queue.length;
  $('completion').hidden = !complete;
  $('move').hidden = complete;
  $('actions').hidden = complete;
  $('completeText').textContent = session.again.length ? 'もう一度の ' + session.again.length + ' 枚を復習しましょう。' : count + ' 枚すべて学習しました。';
  $('restart').textContent = session.again.length ? 'もう一度のカードを復習' : '最初から学習する';
  back = false;
  $('card').classList.remove('flip');
  $('card').setAttribute('aria-pressed','false');
  if (complete) return;
  const index = session.queue[0];
  $('card').innerHTML = set.cards[index].map((text,i) => '<span class="face ' + (i ? 'back' : 'front') + (text.length > 30 ? ' long' : '') + '" aria-hidden="' + !!i + '"><span class="facelabel">' + (i ? '答え' : '問題') + '</span><span class="number">' + (index + 1) + ' / ' + count + '</span><strong class="word">' + escapeHtml(text) + '</strong><span class="hint">' + icon('refresh') + (i ? '左右に払って仕分ける' : 'タップして答えをみる') + '</span></span>').join('');
}
function flip() {
  if (busy || !currentSet().session.queue.length) return;
  back = !back;
  $('card').classList.toggle('flip', back);
  $('card').setAttribute('aria-pressed', String(back));
  $('flip').innerHTML = icon('cards') + (back ? '問題に戻る' : '答えを見る');
  $('card').querySelectorAll('.face').forEach((face,i) => face.setAttribute('aria-hidden', String(i !== Number(back))));
}
function rate(known) {
  const set = currentSet();
  if (busy || !set.session.queue.length) return;
  busy = true;
  const move = $('move'), direction = known ? 1 : -1;
  move.style.transition = 'transform .2s, opacity .2s';
  move.style.transform = 'translateX(' + direction * 120 + 'px) rotate(' + direction * 10 + 'deg)';
  move.style.opacity = '0';
  setTimeout(() => {
    set.session[known ? 'good' : 'again'].push(set.session.queue.shift());
    save();
    $('card').style.transition = 'none';
    if (page === 'study') renderStudy();
    if (page === 'library') renderLibrary();
    move.style.cssText = '';
    void move.offsetWidth;
    $('card').style.transition = '';
    busy = false;
  }, 210);
}
function startSet(id) { if (busy) return; state.activeId = id; save(); showPage('study'); }
$('switchSet').onclick = () => {
  $('selector').hidden = !$('selector').hidden;
  $('switchSet').setAttribute('aria-expanded', String(!$('selector').hidden));
  if (!$('selector').hidden) $('deckSelect').focus();
};
$('deckSelect').onchange = event => { if (busy) { event.target.value = state.activeId; return; } startSet(event.target.value); $('selector').hidden = true; $('switchSet').setAttribute('aria-expanded','false'); };
$('card').onclick = event => { if (!suppressClick || event.detail === 0) flip(); suppressClick = false; };
$('flip').onclick = flip;
$('again').onclick = () => rate(false);
$('good').onclick = () => rate(true);
$('restart').onclick = () => { const set = currentSet(); if (set.session.again.length) { set.session.queue = set.session.again; set.session.again = []; } else set.session = freshSession(set.cards); save(); renderStudy(); };
$('move').onpointerdown = event => {
  if (busy || !event.isPrimary || event.button !== 0) return;
  drag = {id:event.pointerId,x:event.clientX,y:event.clientY,axis:null};
  suppressClick = false;
  try { $('card').setPointerCapture(event.pointerId); } catch {}
};
function trackGesture(event) {
  if (!drag || drag.id !== event.pointerId) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  if (!drag.axis && Math.max(Math.abs(dx), Math.abs(dy)) > 8) { drag.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y'; suppressClick = true; }
  if (drag.axis === 'x') $('move').style.transform = 'translateX(' + dx * .65 + 'px) rotate(' + dx * .045 + 'deg)';
}
$('move').onpointermove = trackGesture;
$('move').onpointerup = event => {
  if (!drag || drag.id !== event.pointerId) return;
  trackGesture(event);
  const dx = event.clientX - drag.x, horizontal = drag.axis === 'x';
  drag = null;
  if (horizontal && Math.abs(dx) > Math.min(60, $('move').clientWidth * .17)) rate(dx > 0);
  else $('move').style.transform = '';
};
$('move').onpointercancel = () => { drag = null; suppressClick = true; $('move').style.transform = ''; };
function libraryTile(set) {
  const session = set.session;
  const started = session.good.length + session.again.length > 0;
  const resume = started && session.queue.length > 0;
  const destination = resume ? '続きを学習' : !session.queue.length && session.again.length ? '復習する' : !session.queue.length ? 'もう一周する' : '学習する';
  const id = escapeHtml(set.id);
  return '<article class="panel decktile"><div class="row tilehead"><span class="deckicon">' + icon('book') + '</span><span class="tag">' + escapeHtml(set.subject || '未分類') + '</span></div><div><h2>' + escapeHtml(set.title) + '</h2><p>' + set.cards.length + ' 枚 · 覚えた ' + session.good.length + ' 枚</p></div><div class="tileprogress"><i style="width:' + session.good.length / set.cards.length * 100 + '%"></i></div><div class="reviewline">' + (session.again.length ? '要復習 ' + session.again.length + ' 枚' : started ? '復習待ちのカードなし' : '未学習') + '</div><div class="row tilebottom"><button class="textbutton" data-view="' + id + '">カード一覧</button><button class="button primary" data-study="' + id + '">' + destination + ' →</button></div></article>';
}
function renderLibrary() {
  const query = $('search').value.trim().toLocaleLowerCase();
  const sets = state.sets.filter(set => (set.title + ' ' + set.subject).toLocaleLowerCase().includes(query));
  $('libraryStats').innerHTML = '<strong>' + state.sets.length + '</strong><span>セット</span>　<strong>' + state.sets.reduce((n,set) => n + set.cards.length, 0) + '</strong><span>枚のカード</span>';
  $('setCount').textContent = sets.length + ' セット';
  $('deckGrid').innerHTML = sets.length ? sets.map(libraryTile).join('') : '<p class="empty">該当するセットがありません。</p>';
}
$('search').oninput = renderLibrary;
function addEditorRow(front = '', answer = '') {
  const row = document.createElement('div');
  row.className = 'editorcard';
  row.innerHTML = '<div class="row"><b></b><button class="remove" type="button" aria-label="このカードを削除">削除</button></div><div class="editorfields"><label>表面 · 問題<textarea class="frontInput" required maxlength="200" placeholder="例：resilient"></textarea></label><label>裏面 · 答え<textarea class="answerInput" required maxlength="200" placeholder="例：回復力のある"></textarea></label></div>';
  row.querySelector('.frontInput').value = front;
  row.querySelector('.answerInput').value = answer;
  row.querySelector('.remove').onclick = () => { row.remove(); numberRows(); };
  $('cardsEditor').append(row);
  numberRows();
}
function numberRows() {
  const rows = [...$('cardsEditor').children];
  $('editorCount').textContent = rows.length + ' 枚';
  rows.forEach((row,i) => { row.querySelector('b').textContent = 'カード ' + (i + 1); row.querySelector('.remove').disabled = rows.length === 1; });
}
$('addRow').onclick = () => { addEditorRow(); $('cardsEditor').lastElementChild.querySelector('textarea').focus(); };
function resetEditor() {
  appendId = null;
  $('cancelAppend').hidden = true;
  $('setForm').reset();
  $('setName').readOnly = false;
  $('setSubject').readOnly = false;
  $('createHeading').textContent = '学習セットを作成';
  $('cardsEditor').innerHTML = '';
  addEditorRow();
}
$('cancelAppend').onclick = resetEditor;
$('setForm').onsubmit = event => {
  event.preventDefault();
  const cards = [...$('cardsEditor').children].map(row => [row.querySelector('.frontInput').value.trim(), row.querySelector('.answerInput').value.trim()]);
  const title = $('setName').value.trim();
  if (!title || !validCards(cards)) { toast('セット名と、カードの両面を入力してください。'); return; }
  let set;
  if (appendId) {
    set = state.sets.find(item => item.id === appendId);
    const offset = set.cards.length;
    set.cards.push(...cards);
    set.session.queue.push(...cards.map((_,i) => offset + i));
  } else {
    set = {id:'set-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8),title,subject:$('setSubject').value.trim(),cards,session:freshSession(cards)};
    state.sets.push(set);
  }
  state.activeId = set.id;
  const persisted = save();
  resetEditor();
  $('search').value = '';
  showPage(event.submitter && event.submitter.value === 'study' ? 'study' : 'library');
  toast(persisted ? '学習セットを保存しました' : 'この画面を開いている間、学習できます');
};
function viewCards(id, trigger) {
  modalSetId = id;
  modalTrigger = trigger;
  const set = state.sets.find(item => item.id === id);
  $('modalTitle').textContent = set.title;
  $('cardList').innerHTML = set.cards.map(([front,answer]) => '<div class="listitem"><strong>' + escapeHtml(front) + '</strong><span>' + escapeHtml(answer) + '</span></div>').join('');
  $('modal').hidden = false;
  $('closeModal').focus();
}
function closeModal() { $('modal').hidden = true; if (modalTrigger && modalTrigger.isConnected) modalTrigger.focus(); }
$('closeModal').onclick = closeModal;
$('modal').onclick = event => { if (event.target === $('modal')) closeModal(); };
$('appendCards').onclick = () => {
  const draft = $('setName').value.trim() || [...$('cardsEditor').querySelectorAll('textarea')].some(input => input.value.trim());
  if (draft) { toast('作成中のセットを先に保存してください。'); return; }
  const set = state.sets.find(item => item.id === modalSetId);
  closeModal();
  appendId = set.id;
  $('cancelAppend').hidden = false;
  $('setName').value = set.title;
  $('setSubject').value = set.subject;
  $('setName').readOnly = true;
  $('setSubject').readOnly = true;
  $('createHeading').textContent = 'カードを追加';
  showPage('create');
};
document.addEventListener('click', event => {
  const tab = event.target.closest('[data-page]');
  if (tab) { showPage(tab.dataset.page); return; }
  const study = event.target.closest('[data-study]');
  if (study && !busy) {
    startSet(study.dataset.study);
    if (!currentSet().session.queue.length) $('restart').click();
  }
  const view = event.target.closest('[data-view]');
  if (view) viewCards(view.dataset.view, view);
});
document.addEventListener('keydown', event => {
  if (!$('modal').hidden) {
    if (event.key === 'Escape') closeModal();
    if (event.key === 'Tab') {
      const first = $('closeModal'), last = $('appendCards');
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
    return;
  }
  if (page !== 'study' || event.repeat || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
  if (event.code === 'Space' && (event.target === $('card') || event.target.tagName !== 'BUTTON')) { event.preventDefault(); flip(); }
  if (event.key === 'ArrowLeft') { event.preventDefault(); rate(false); }
  if (event.key === 'ArrowRight') { event.preventDefault(); rate(true); }
});
resetEditor();
renderStudy();
save();
</script>
